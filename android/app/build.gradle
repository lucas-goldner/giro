plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.lucasgoldner.giro"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        // Hyphens are not allowed in Android application ids, so this is
        // the iOS bundle id without one.
        applicationId = "com.lucasgoldner.giro"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // maplibre_flutter_gpu needs API 29.
        minSdk = 29
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // The MapLibre bridge ships for these two ABIs only; a 32-bit ARM
        // build would install and then have no map.
        ndk {
            abiFilters += ["arm64-v8a", "x86_64"]
        }
    }

    // The same two flavors as the iOS schemes: `flutter run --flavor dev
    // -t lib/main_dev.dart`, `flutter build apk --flavor prod -t lib/main_prod.dart`.
    flavorDimensions += "flavor"
    productFlavors {
        dev {
            dimension = "flavor"
            applicationIdSuffix = ".dev"
            manifestPlaceholders["appLabel"] = "Giro Dev"
        }
        prod {
            dimension = "flavor"
            manifestPlaceholders["appLabel"] = "Giro"
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Importing walks from Health Connect (HealthConnectBridge.kt).
    implementation("androidx.health.connect:connect-client:1.1.0")
    implementation("androidx.activity:activity-ktx:1.10.1")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
}
