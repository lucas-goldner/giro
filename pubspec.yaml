name: giro
description: "Exploring map app"
publish_to: "none"
version: 1.1.0

environment:
  sdk: ^3.13.0

dependencies:
  cupertino_icons: ^2.0.0
  duration: ^4.0.3
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_slidable: ^4.0.0
  geolocator: ^14.1.2
  # Replaces the endorsed google_maps_flutter_ios implementation (pulled in by
  # platform_maps_flutter), which is CocoaPods-only. A direct dependency on an
  # alternative implementation wins over the endorsed default.
  google_maps_flutter_ios_sdk10: ^2.19.0
  intl: ^0.20.3
  map_launcher: ^7.0.0
  mmkv: ^2.4.3
  platform_maps_flutter: ^1.0.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

dependency_overrides:
  # Upstream apple_maps_flutter (pulled in by platform_maps_flutter) has no
  # Swift Package Manager support. This fork is upstream master plus a
  # Package.swift, which the CocoaPods-free iOS build requires.
  apple_maps_flutter:
    git:
      url: https://github.com/AppMachine/apple_maps_flutter.git
      ref: 505d27edc1be188d742306b3824c474948149bd6

flutter:
  uses-material-design: true
