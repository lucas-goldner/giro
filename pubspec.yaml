name: giro
description: "Exploring map app"
publish_to: "none"
version: 1.1.0

environment:
  sdk: ^3.13.0

dependencies:
  cupertino_icons: ^2.0.0
  duration: ^4.0.3
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_gpu:
    sdk: flutter
  geolocator: ^14.1.2
  hooks: ^2.0.2
  intl: ^0.20.3
  map_launcher: ^7.0.0
  # MapLibre rendered with Flutter GPU (no platform view), so the fog of war
  # and markers are drawn in the same frame as the map. Vendored fork of
  # hyshu/maplibre_flutter_gpu 0.2.0; see packages/maplibre_flutter_gpu/GIRO.md.
  maplibre_flutter_gpu:
    path: packages/maplibre_flutter_gpu
  mmkv: ^2.4.3
  vector_math: ^2.2.0
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    # Sonic-coloured MapLibre style on OpenFreeMap tiles (tool/make_sonic_style.py).
    - assets/map/sonic_style.json
    # Fog of war + building shaders, compiled by hook/build.dart from shaders/.
    - assets/shaderbundles/
  fonts:
    # Sonic Generations-style HUD type (SIL Open Font License, see
    # assets/fonts/OFL-BarlowCondensed.txt).
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/BarlowCondensed-BlackItalic.ttf
          weight: 900
          style: italic
